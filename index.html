<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doggos</title>

    <link rel="stylesheet" href="style.css">
    <script defer src="index.js"></script>
</head>
<body>
    <section id="random-dog-pics-area"></section>
    <div id="wrapper">

        <div id="loading-indicator">
            <p>Loading...</p>
            <img src="https://media.tenor.com/bQ17NdDKGrMAAAAM/maya-chase-tail.gif" alt="dog chasing it's tail gif">
        </div>

        <h1>All About Dogs</h1>

        <section id="random-dog-facts-area">
            <h2>Random Dog Facts</h2>

            <ul id="random-dog-facts"></ul>

            <button id="get-new-dog-facts">Get New Dog Facts</button>
        </section>

        <section id="featured-dog-breed-area">
            <h2>Featured Dog Breed</h2>
            <h3 id="breed-name"></h3>
            <p><img id="breed-image" alt="dog photo" hidden></p>
            <p><span class="label">Description: </span><span id="breed-description"></span></p>
            <p><span class="label">Life Span: </span><span id="breed-life-span"></span></p>
            <p><span class="label">Weight Range: </span><span id="breed-weight"></span></p>
            <p><span class="label">Breed Group: </span><span id="breed-group"></span></p>
            <p><span class="label">Temperment: </span><span id="breed-temperment"></span></p>
            <p><span class="label">Country of Origin: </span><span id="breed-origin"></span></p>
            <p><span class="label">History: </span><span id="breed-history"></span></p>

        </section>
        
        <section id="change-dog-breed-area">
            <p id="change-breed"><span class="label">Change Breed </span><select id="dog-breed-select"></select></p>
        </section>
    </div>
</body>
</html>
